services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${DB_USER:-monitor}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-monitor}
      POSTGRES_DB: ${DB_NAME:-systemmonitoring}
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data

volumes:
  timescaledb_data:
